<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASMA MEDICAL · Pharmacy Software</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0b7a3e">
<style>
:root{--g:#0b7a3e;--g2:#e8f5ee;--r:#c62828;--n:#14305c;--bg:#f4f7f6;--bd:#d9e2de}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,'Noto Sans Bengali',sans-serif;background:var(--bg);color:#1b2a24;font-size:15px}
header{background:#fff;border-bottom:3px solid var(--g);display:flex;align-items:center;gap:10px;padding:8px 14px;position:sticky;top:0;z-index:5}
header img{height:44px}header .t b{color:var(--r);font-size:19px;letter-spacing:.5px}header .t small{display:block;color:var(--n)}
header .sp{flex:1}.pill{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}.on{background:var(--g2);color:var(--g)}.off{background:#fdecea;color:var(--r)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--n)}nav button{background:transparent;color:#fff;border:0;padding:9px 13px;border-radius:8px;white-space:nowrap;font-size:14px;cursor:pointer}
nav button.a{background:#fff;color:var(--n);font-weight:700}
main{padding:14px;max-width:1200px;margin:auto}.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;color:var(--n)}input,select{font:inherit;padding:9px 10px;border:1px solid #b9c7c1;border-radius:8px;width:100%;background:#fff}
input:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{font-size:12px;color:#55665f;display:block}
button.p,button.b{font:inherit;padding:10px 16px;border-radius:8px;border:0;cursor:pointer;font-weight:600}button.p{background:var(--g);color:#fff}button.b{background:#e9eef0;color:var(--n)}
button.x{background:none;border:0;color:var(--r);font-size:18px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid #edf1ef;text-align:left;font-size:14px}th{background:#f0f5f2;color:var(--n);font-size:12px}
.tw{overflow-x:auto}.big{font-size:26px;font-weight:800;color:var(--n)}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kp .card{margin:0}.red{color:var(--r)}.grn{color:var(--g)}.mut{color:#6b7c75;font-size:12px}
.rack{display:inline-block;background:var(--n);color:#fff;border-radius:6px;padding:3px 9px;font-weight:700;font-size:13px}
.hero input{font-size:22px;padding:14px 16px;border:2px solid var(--g)}
.res{margin-top:10px}.ri{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid #edf1ef}.ri .nm{flex:1}.ri .nm b{font-size:16px}
.dd{position:relative}.dd .list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--bd);border-radius:8px;max-height:280px;overflow:auto;z-index:9;box-shadow:0 6px 18px #0002}
.dd .list div{padding:9px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0}.dd .list div.h,.dd .list div:hover{background:var(--g2)}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;color:var(--n);padding:10px 0}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:#fff3e0;color:#b45f06;font-weight:700}.tag.ex{background:#fdecea;color:var(--r)}
#print{display:none}
@media(max-width:600px){header .t small,#dev{display:none}header img{height:36px}.pill{font-size:11px;padding:3px 7px}.ri{flex-wrap:wrap}.ri .nm{flex-basis:100%}.rack{white-space:nowrap}}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}}
.l2{display:block;font-size:.72em;opacity:.75;font-weight:400}label .l2,h3 .l2,th .l2,td .l2,button.p .l2,b .l2,h2 .l2,.tw .l2{display:inline;margin-left:6px;font-size:.78em}.l2p{color:#5b6b7f;font-size:.95em}
</style></head><body>
<header><img src="logo.png" alt=""><div class="t"><b>ASMA MEDICAL</b><small>Hospital More, Roypara, Chanchal, Malda</small></div><div class="sp"></div>
<span id="net" class="pill on">Online</span><span id="dev" class="pill on" style="background:#eef2fb;color:var(--n)"></span>
<span id="who"></span><select id="lng" onchange="setLang(this.value)" title="Second language" style="width:auto;padding:6px"><option value="none">English only</option><option value="bn">English + বাংলা</option><option value="hi">English + हिन्दी</option></select></header>
<nav id="nav"></nav><main id="main"></main><div id="print"></div>
<script src="boot.js"></script>
</body></html>
